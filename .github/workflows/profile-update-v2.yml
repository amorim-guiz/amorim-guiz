name: Profile Stats v2

on:
  workflow_dispatch:

  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Update profile statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USER_NAME: amorim-guiz
        run: python today.py

      - name: Commit profile changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dark_mode.svg light_mode.svg cache/

          if git diff --cached --quiet; then
            echo "No profile changes to commit."
            exit 0
          fi

          git commit -m "chore: update profile stats"
          git push
